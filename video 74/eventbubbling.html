<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event bubbling</title>
    <style>
        .child{
            background-color: aliceblue;
            border: 2px solid black;
            padding : 14px;
            margin: 14px;
            cursor: pointer;
        }
        .childcontainer{
            background-color: aquamarine;
            
            padding : 14px;
            margin: 14px;
            
        }
        .contaianer{
            background-color: bisque;
          padding : 14px;
            margin: 14px;

        } 
    </style>
</head>
<body>
    <div class="container">
        <section class="childcontainer">
            <div class="child">
                i am a child
            </div>
        </section>
    </div>
    <script>
        document.querySelector(".child").addEventListener("contextmenu",()=>{
            e.stopPropagation()
            alert("Child Was clicked")
        })
        document.querySelector(".childcontainer").addEventListener("contextmenu",()=>{
            e.stopPropagation()
            alert("Child container Was clicked")
        })
        document.querySelector(".container").addEventListener("contextmenu",()=>{
            alert("Container Was clicked")
        })
        function getRandomColor() {
            let val1 = Math.ceil(0 + Math.random() * 255);
            let val2 = Math.ceil(0 + Math.random() * 255);
            let val3 = Math.ceil(0 + Math.random() * 255);
            return `rgb(${val1}, ${val2}, ${val3})`
        }
        let a=setInterval(()=>{
            document.querySelector("childcontainer").style.background = "red"
        },1000);    
        console.log(a)
    </script>
</body>
</html>
