<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen display property</title>
<style>
    *{
        margin:0;
        padding: 0;
    }
    .box{
        border: 2px solid blue;
        display: inline-block;
        padding: 44px;
        margin: 33px;
    }
    .box1{
        visibility: hidden ;
    }
    </style>
</head>
<body>
    <div class="box box1">
        i am a box
    </div>
    <span class="box">  
        I am a good boy
    </span>
</body>
</html>
