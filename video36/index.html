<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS multicolor website</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet");
    </style>
    <style>
         :root{
            --primary-color: rgb(187, 92, 187);
            --text-color: white;
            --secondary-color: rgb(224, 218, 228);;
         }
         body{
            background-color: var(--secondary-color);
         }
        *{
            margin:0;
            padding:0;
        }
        nav{
            background-color: blueviolet;
            padding: 12px  0;
             font-family: "Baloo Bhai 2", sans-serif;
        }
        ul li{
            list-style: none;
            display: inline;
            padding: 23px;
            font-weight: bolder;
            color: var(--text-color);
        }
        ul li a{
            color: var(--text-color);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">home</a></li>
                <li><a href="/">about</a></li>
                <li><a href="/">services</a></li>
                <li><a href="/">contact</a></li>
            </ul>
        </nav>
    </header>
</body>
</html>
