<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video and Audio player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>My videos and audios</h1>
    <h2>some of the videos</h2>
    <div>
        <video width="320" height="240" src="video1.mp4" controls></video>
        <video width="320" height="240" src="video2.mp4" controls></video>
        <video width="320" height="240" src="video3.mp4" controls></video>
    </div>
    <h2>some of the audios</h2>
    <div>
        <audio width="320" height="240" src="audio1.mp3" controls></audio>
        <audio width="320" height="240" src="audio2.mp3" controls></audio>
        <audio width="320" height="240" src="audio3.mp3" controls></audio>
    </div>
</body>
</html>
