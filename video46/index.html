<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS animation</title>
    <style>
        .container{
            background-color: rgb(19, 98, 98);
            height: 30vh;
            width: 80vw;
        }
        .box{
            width:34px;
            height:44px;
            /* background-color: rgb(9, 192, 202); */
            /* animation: luckykaanimation ;
            animation-duration: 1s;
            animation-iteration-count:  infinite ;
            animation-timing-function: ease-in-out;
            animation-delay: 1s; 
            animation-direction:alternate-reverse ;
            animation-play-state: paused; */
            animation: luckykaanimation   3s   ease-in-out   infinite  alternate-reverse ,
            lucky2  3s   ease-in-out   infinite  alternate-reverse ;
        }
        @keyframes luckykaanimation {
            from{
                background-color: yellow;
               
            }
            to{
                transform: translateY(500px);
                background-color: crimson;
            }
        }
        @keyframes lucky2{
            0%{
                transform: rotate(100deg) ;
            }
            20%{
                transform: rotate(200deg) ;
            }
            50%{
                transform: rotate(300deg) ;
            }
            80%{
                transform: rotate(400deg) ;
            }
            100%{
                transform: rotate(500deg) ;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            BOX
        </div>
    </div>
</body>
</html>
